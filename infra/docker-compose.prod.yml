#   Proprietary. All rights reserved. See LICENSE in the repository root.
# =============================================================================

name: usdtg-stack

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./landing:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nyrvexis
      - nyrduel
      - nyrvexa
    networks:
      - web

  nyrvexis:
    build:
      context: ../../nyrvexis
    restart: unless-stopped
    expose:
      - "8787"
    environment:
      NODE_ENV: production
      KR_HOST: 0.0.0.0
      KR_PORT: "8787"
      CORS_ORIGIN: "https://nyrvexis.com,https://www.nyrvexis.com"
    volumes:
      - nyrvexis_data:/app/data
    networks:
      - web

  nyrduel:
    build:
      context: ../../nyrduel
    restart: unless-stopped
    expose:
      - "8788"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8788"
      DB_PATH: /app/data/nyrduel.sqlite
      CORS_ORIGIN: "https://nyrduel.com,https://www.nyrduel.com,https://nyrvexa.com"
      PRIZE_POOL_USDTG: "100"
      TRUST_PROXY: "172.16.0.0/12,10.0.0.0/8,127.0.0.0/8"
    volumes:
      - nyrduel_data:/app/data
    networks:
      - web

  nyrvexa:
    build:
      # The Nyrvexa repo holds both the Unity legacy (Assets/, Library/, …)
      # and the active TS web port (apps/, services/, packages/) at the
      # repository root. Docker build uses .dockerignore at the root to
      # skip Unity-only paths.
      context: ..
    restart: unless-stopped
    expose:
      - "8789"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8789"
      DB_PATH: /app/data/nyrvexa.sqlite
      CORS_ORIGIN: "https://nyrvexa.com,https://www.nyrvexa.com"
      TRUST_PROXY: "172.16.0.0/12,10.0.0.0/8,127.0.0.0/8"
    volumes:
      - nyrvexa_data:/app/data
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:
  nyrvexis_data:
  nyrduel_data:
  nyrvexa_data:

networks:
  web:
    driver: bridge
